# Сборка не требует ничего извне: backend лежит в дереве и написан на
# стандартной библиотеке. Иначе `pip install .` в пустом venv без сети
# падал на загрузке setuptools - до того, как доходило до тестов.
[build-system]
requires = []
build-backend = "autopilot_build"
backend-path = ["build_backend"]

[project]
name = "codex-autopilot"
version = "0.10.0b0"
description = "Serial visible Codex workers with evidence-backed project memory"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
codex-autopilot = "codex_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

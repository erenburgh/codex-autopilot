# The build needs nothing from outside: the backend lives in the tree and
# is written on the standard library. Otherwise `pip install .` in an empty
# offline venv failed downloading setuptools - before it got to the tests.
[build-system]
requires = []
build-backend = "autopilot_build"
backend-path = ["build_backend"]

[project]
name = "codex-autopilot"
version = "0.11.8b0"
description = "Serial visible Codex workers with evidence-backed project memory"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
codex-autopilot = "codex_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
